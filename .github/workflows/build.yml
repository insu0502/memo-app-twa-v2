name: Build TWA APK/AAB

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 + Android SDK 설치
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Keystore 디코딩 (GitHub Secrets → 파일)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > www/release-keystore.jks
          ls -la www/release-keystore.jks
          echo "=== Keystore 유효성 검사 ==="
          keytool -list -keystore www/release-keystore.jks -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" 2>&1 | head -10

      - name: Bubblewrap CLI 전역 설치
        run: |
          npm install -g @bubblewrap/cli

      - name: "@bubblewrap/core 로컬 설치"
        run: |
          npm install @bubblewrap/core

      - name: Android 프로젝트 생성
        run: |
          node generate-project.js

      - name: config.json 생성
        run: |
          cd www
          echo "{\"jdkPath\": \"$JAVA_HOME\", \"androidSdkPath\": \"$ANDROID_HOME\"}" > config.json

      - name: Bubblewrap 빌드
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          cd www
          echo "=== 환경 정보 ==="
          echo "JAVA_HOME: $JAVA_HOME"
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          echo "작동 중 경로: $(pwd)"
          echo "=== config.json ==="
          cat config.json
          echo "=== bubblewrap 버전 ==="
          bubblewrap --version 2>&1 || echo "bubblewrap 없음"
          echo "=== keystore 확인 ==="
          ls -la release-keystore.jks 2>&1
          echo "=== 실제 빌드 실행 ==="
          echo "n" | bubblewrap build --config config.json --skipPwaValidation 2>&1

      - name: 결과물 업로드 (아티팩트)
        uses: actions/upload-artifact@v4
        with:
          name: twa-build-output
          path: |
            www/app/build/outputs/apk/release/*.apk
            www/app/build/outputs/bundle/release/*.aab
          retention-days: 7
