name: Build TWA APK/AAB

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Android SDK 설치
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: Android SDK 컴포넌트 설치
        run: |
          echo "=== SDKManager로 필수 컴포넌트 설치 ==="
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>&1 | tail -20
          echo "=== 설치 후 경로 확인 ==="
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME" 2>/dev/null || ls -la "$ANDROID_SDK_ROOT" 2>/dev/null || echo "SDK 경로 없음!"

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Keystore 디코딩 (GitHub Secrets → 파일)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > www/release-keystore.jks
          ls -la www/release-keystore.jks
          echo "=== Keystore 유효성 검사 ==="
          keytool -list -keystore www/release-keystore.jks -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" 2>&1 | head -10

      - name: Bubblewrap CLI 전역 설치
        run: |
          npm install -g @bubblewrap/cli

      - name: "@bubblewrap/core 로컬 설치"
        run: |
          npm install @bubblewrap/core

      - name: Android 프로젝트 생성
        run: |
          node generate-project.js

      - name: config.json 생성
        run: |
          cd www
          # 실제 SDK 경로 찾기
          if [ -d "$ANDROID_HOME" ]; then
            SDK_PATH="$ANDROID_HOME"
          elif [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK_PATH="$ANDROID_SDK_ROOT"
          elif [ -d "/opt/android-sdk" ]; then
            SDK_PATH="/opt/android-sdk"
          else
            SDK_PATH=$(find / -type d -name "platforms" -path "*/android-*" 2>/dev/null | head -1 | xargs dirname 2>/dev/null || echo "")
            if [ -z "$SDK_PATH" ]; then
              echo "❌ SDK 경로를 찾을 수 없음!"
              exit 1
            fi
          fi
          echo "사용할 SDK 경로: $SDK_PATH"
          echo "sdk 경로 존재 확인: $(ls -d "$SDK_PATH" 2>&1)"
          echo "{"jdkPath": "$JAVA_HOME", "androidSdkPath": "$SDK_PATH"}" > config.json
          cat config.json

      - name: Bubblewrap 빌드
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          cd www
          set +e
          echo "=== 환경 정보 ===" > /tmp/build-debug.log
          echo "JAVA_HOME: $JAVA_HOME" >> /tmp/build-debug.log
          echo "ANDROID_HOME: $ANDROID_HOME" >> /tmp/build-debug.log
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT" >> /tmp/build-debug.log
          echo "작동 중 경로: $(pwd)" >> /tmp/build-debug.log
          echo "=== config.json ===" >> /tmp/build-debug.log
          cat config.json >> /tmp/build-debug.log
          echo "=== bubblewrap 버전 ===" >> /tmp/build-debug.log
          bubblewrap --version >> /tmp/build-debug.log 2>&1 || echo "bubblewrap 없음" >> /tmp/build-debug.log
          echo "=== keystore 확인 ===" >> /tmp/build-debug.log
          ls -la release-keystore.jks >> /tmp/build-debug.log 2>&1
          echo "=== 실제 빌드 실행 (시작) ===" >> /tmp/build-debug.log
          echo "n" | bubblewrap build --config config.json --skipPwaValidation >> /tmp/build-debug.log 2>&1
          BUILD_EXIT=$?
          echo "=== 빌드 종료 (exit: $BUILD_EXIT) ===" >> /tmp/build-debug.log
          echo "=== 전체 환경 변수 (BUBBLEWRAP_*) ===" >> /tmp/build-debug.log
          env | grep -i bubblewrap >> /tmp/build-debug.log 2>&1 || echo "(없음)" >> /tmp/build-debug.log
          echo "=== 전체 환경 변수 (ANDROID/JAVA) ===" >> /tmp/build-debug.log
          env | grep -iE 'android|java' >> /tmp/build-debug.log 2>&1 || echo "(없음)" >> /tmp/build-debug.log
          echo "=== gradle 결과 ===" >> /tmp/build-debug.log
          ls -la app/build/ >> /tmp/build-debug.log 2>&1 || echo "(build 폴더 없음)" >> /tmp/build-debug.log
          echo "build exit code: $BUILD_EXIT"
          exit $BUILD_EXIT

      - name: 결과물 업로드 (아티팩트)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twa-build-output
          path: |
            www/app/build/outputs/apk/release/*.apk
            www/app/build/outputs/bundle/release/*.aab
            /tmp/build-debug.log
          retention-days: 7
